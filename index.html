<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="./assets/fewCloudsDay-CbXtuzUy.svg" type="image/svg" />
        <title>Weather App</title>
      <script type="module" crossorigin src="./assets/index-DZfBqXpm.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-DLD1Q2DJ.css">
    </head>

    <body>
        <div class="main-wrapper">
            <h1 class="visually-hidden">Приложение Weather App для отображение погоды</h1>
            <header class="header">
                <a href="#" class="logo">
                    <picture>
                        <source srcset="data:image/svg+xml,%3csvg%20width='54'%20height='48'%20viewBox='0%200%2054%2048'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M40.384%2010.64H44.864L53.216%2033.36H48.672L46.56%2027.696H38.624L36.544%2033.36H32L40.384%2010.64ZM45.76%2024.592L42.624%2015.216L39.36%2024.592H45.76Z'%20fill='%23202020'/%3e%3cpath%20d='M10.144%2010.704H14.24L16.832%2018.224L19.456%2010.704H23.52L19.616%2021.04L22.496%2028.272L28.928%2010.64H33.728L24.64%2033.36H20.832L16.832%2023.824L12.864%2033.36H9.056L0%2010.64H4.736L11.2%2028.272L14.016%2021.04L10.144%2010.704Z'%20fill='%23F5F4F4'/%3e%3c/svg%3e" media="(max-width: 1023px)" />
                        <img src="./assets/logo-D3SK8gOQ.svg" alt="Логотип приложения" width="192" height="48" />
                    </picture>
                </a>
                <form action="" method="post" class="search-bar" id="search-form">
                    <input type="text" class="search-bar__input" id="search-bar" placeholder="Поиск по городу" />
                    <button type="reset" class="search-bar__btn" id="search-bar-btn" disabled></button>
                </form>
            </header>
            <main class="content-wrapper">
                <article class="weather-current">
                    <div class="weather-current__information">
                        <h2 class="weather-current__title-city">Кременчуг-константиновское</h2>
                        <time class="weather-current__temperature-date" datetime="01-06">Суббота, 06 января</time>
                        <time class="weather-current__temperature-time" datetime="11:29">11:29</time>
                    </div>
                    <span class="weather-current__temperature">-7°</span>
                    <div class="weather-current__state">
                        <div class="weather-current__content">
                            <img src="./assets/brokenCloudsDay-CbkynoBa.svg" alt="" width="24" height="24" />
                            <span class="weather-current__icon-description">Облачно с прояснениями</span>
                        </div>
                        <span class="weather-current__fill">Ощущается как -11°</span>
                    </div>
                </article>
                <ul class="weather-indications" id="weather-indications"></ul>
            </main>
            <section class="weather-group">
                <div class="weather-group__header">
                    <h2 class="weather-group__title">Прогноз:</h2>
                    <nav>
                        <ul class="weather-group__options">
                            <li>
                                <button class="weather-group__link weather-group__link--underline" type="button" id="weather-day">на 24 часа</button>
                            </li>
                            <li>
                                <button class="weather-group__link" type="button" id="weather-five-day">на 5 дней</button>
                            </li>
                        </ul>
                    </nav>
                </div>
                <nav class="weather-group__details">
                    <button type="button" class="weather-group__btn weather-group__btn--disable" id="weather-group-prev-day" disabled>
                        <img src="data:image/svg+xml,%3csvg%20width='24'%20height='24'%20viewBox='0%200%2024%2024'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M16%203L7%2012L16%2021'%20stroke='%23545454'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3c/svg%3e" alt="Кнопка для просмотра более ранних прогнозов погоды" width="24" height="24" />
                    </button>
                    <ul class="weather-group__list" id="weather-group__list"></ul>
                    <button type="button" class="weather-group__btn weather-group__btn--rotate" id="weather-group-next-day">
                        <img src="data:image/svg+xml,%3csvg%20width='24'%20height='24'%20viewBox='0%200%2024%2024'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M16%203L7%2012L16%2021'%20stroke='%23545454'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3c/svg%3e" alt="Кнопка для просмотра следующих прогнозов погоды" width="24" height="24" />
                    </button>
                </nav>
            </section>
            <footer class="footer">
                <nav class="footer__link">
                    Проект выполнен в рамках стажировки&nbsp;
                    <a href="https://preax.ru" target="_blank" rel="noopener noreferrer">PREAX</a>
                </nav>
            </footer>
        </div>
        <template id="weather-group-template">
            <li id="detail-card" class="weather-group__card">
                <time id="time" datetime=""></time>
                <img id="image" alt="иконка отображения погоды" width="32" height="32" />
                <span id="temperature"></span>
            </li>
        </template>
        <template id="widget-card-template">
            <li class="card">
                <div class="card__values-container">
                    <h3 class="card__title"></h3>
                    <img class="card__icon" alt="Иконка состояния погоды" width="32" height="32" />
                    <span class="card__value"></span>
                </div>
                <div class="card__bar-container">
                    <div class="card__bar">
                        <div class="card__thumb"></div>
                    </div>
                    <div class="card__range-container">
                        <span class="card__range-description"></span>
                        <span class="card__range-description"></span>
                    </div>
                </div>
            </li>
        </template>
    </body>
</html>
