<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./images/weatherIcons/fewCloudsDay.svg" type="image/svg">
    <title>Weather App</title>
</head>

<body>
    <div class="main-wrapper">
        <h1 hidden>Приложение Weather App для отображение погоды</h1>
        <header class="header">
            <a href="#" class="logo">
                <img class="logo_image" src="./images/logo.svg" alt="Логотип приложения" width="192" height="48">
            </a>
            <div class="search-bar">
                <input type="text" class="search-bar__input" id="search-bar" placeholder="Поиск по городу">
            </div>
        </header>
        <main class="content-wrapper">
            <article class="weather-city">
                <div class="weather-city__information">
                    <h2 class="weather-city__information-city">Москва</h2>
                    <time class="weather-city__temperature-data" datetime="01-06">Суббота, 06 января</time>
                    <time class="weather-city__temperature-time" datetime="11:29">11:29</time>
                </div>
                <span class="weather-city__temperature">-7°</span>
                <div class="weather-city__state">
                    <div class="weather-city__state-icon">
                        <img src="./images/weatherIcons/brokenCloudsDay.svg" alt="Иконка погоды" width="24" height="24">
                        <span>Облачно</span>
                    </div>
                    <span class="weather-city__state-fill">Ощущается как -11°</span>
                </div>
            </article>
            <ul class="weather-list">
                <li class="weather-list__card"></li>
                <li class="weather-list__card"></li>
                <li class="weather-list__card"></li>
                <li class="weather-list__card"></li>
                <li class="weather-list__card"></li>
                <li class="weather-list__card"></li>
            </ul>
        </main>
        <aside class="aside"></aside>
        <footer class="footer"></footer>
    </div>
    <script src="./script.js"></script>
</body>

</html>
